[project]
name = "ordenes-de-trabajo"
version = "0.12.0"
description = "Librerias y programas para gestionar Ordenes de Trabajo de la EERSSA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dask[complete]>=2024.12.1",
    "nltk>=3.9.1",
    "pandas>=2.2.3",
    "pymongo>=4.10.1",
    "pymupdf==1.24.9",
    "pypdf2>=3.0.1",
    "scikit-learn>=1.6.0",
    "unidecode>=1.3.8",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
