services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    # ⚠️ REQUERIDO para que Kafka pueda iniciar con 'service_healthy'
    healthcheck:
      test:
        - CMD-SHELL
        - echo stat | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - 29092:29092
    # Sobreescribimos el comando para pausar 20s tras la validación del healthcheck
    command:
      - sh
      - -c
      - sleep 20 && /etc/confluent/docker/run
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
networks: {}

# Este nuevo composer configura a Kafka para que espere hasta verificar que Zookeeper
# se encuentra levantado y funcionando (healthcheck), y posteriormente añade un retardo
# artificial de 20 segundos antes de ejecutar el proceso principal de Kafka.
