[project]
name = "ordenes-de-trabajo"
version = "0.12.0"
description = "Librerias y programas para gestionar Ordenes de Trabajo de la EERSSA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dask[complete]>=2024.12.1",
    "deltalake>=1.4.2",
    "gspread>=6.2.1",
    "natsort>=8.4.0",
    "nltk>=3.9.1",
    "oauth2client>=4.1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pymongo>=4.10.1",
    "pymupdf==1.24.9",
    "pypdf2>=3.0.1",
    "pypst>=0.8.0",
    "quixstreams==3.10.0",
    "scikit-learn>=1.6.0",
    "typst>=0.14.8",
    "unidecode>=1.3.8",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
